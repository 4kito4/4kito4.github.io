<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="長谷川耀俊 (Aki_Ha) のポートフォリオ。関西大学 化学工学専攻の学生で、Google AI 学生コミュニティのコミュニティアンバサダー。生成AIを使った開発とコミュニティづくりに取り組んでいます。"
    />
    <meta name="color-scheme" content="light dark" />
    <title>長谷川耀俊 / Aki_Ha Portfolio</title>
  </head>
  <body>
    <!-- First-load curtain. Paper-coloured, with the mascot silhouette beating on
         it. Dismissed by REAL readiness (webfonts + the opening's first 24 drop
         frames), capped at 4s, and skipped outright when everything is already
         cached. The bar and the count are the genuine decode tally — there is no
         synthetic progress. Removed instantly under reduced motion. See main.ts. -->
    <div id="preloader" class="preloader" aria-hidden="true">
      <div class="preloader__inner">
        <img
          class="preloader__mark"
          src="/assets/aki_ha_silhouette.png"
          alt=""
          width="110"
          height="110"
          fetchpriority="high"
          decoding="async"
        />
        <div class="preloader__progress">
          <span class="preloader__progress-fill"></span>
        </div>
        <p class="preloader__count">0 / 24</p>
      </div>
    </div>

    <header class="nav">
      <nav class="u-container nav__inner" aria-label="メインナビゲーション">
        <a href="#hero" class="nav__mark"><span data-roll>AKI_HA</span></a>
        <div class="nav__end">
          <div class="nav__links">
            <a href="#about"><span data-roll>自己紹介</span></a>
            <a href="#activity"><span data-roll>活動</span></a>
            <a href="#works"><span data-roll>制作物</span></a>
          </div>
          <!-- C3 sound toggle. Present in the markup from the very first paint so
               its slot is always reserved (CLS stays 0); src/anim/sound.ts makes it
               visible only when a sound layer actually exists — never under
               reduced motion, and never if the motion layer failed to boot. The
               speaker is drawn in CSS rather than as an inline SVG path because
               this project ships no icon dependency and none is being added. -->
          <button
            class="nav__sound"
            type="button"
            aria-pressed="false"
            aria-label="サイトの効果音"
            data-sound-toggle
          >
            <span class="snd" aria-hidden="true">
              <span class="snd__cone"></span>
              <span class="snd__wave"></span>
              <span class="snd__slash"></span>
            </span>
          </button>
        </div>
      </nav>
    </header>

    <main>
      <!-- Intro stage: the hero lives UNDER the opening from the start. The motion
           layer pins this whole stage and plays the opening sequence as an overlay;
           near the end the overlay's opacity fades to 0 so the white end-frame
           dissolves directly into the cream hero (already mid-entrance) with no
           colour seam or empty beat — the pin then releases on a fully continuous
           visual state. Under reduced motion the opening is display:none and this
           collapses to a plain hero. -->
      <div id="intro" class="intro">
        <section id="hero" class="hero"></section>
        <!-- Decorative only (aria-hidden); hidden entirely under reduced motion. -->
        <section id="opening" class="opening" aria-hidden="true"></section>
      </div>

      <section id="about" class="section"></section>
      <section id="activity" class="section"></section>

      <!-- Stack strip: the single editorial marquee. Static, readable markup;
           P3 animates the track via data-animate="marquee". -->
      <div class="stackstrip" aria-hidden="true">
        <div class="u-container stackstrip__track" data-animate="marquee">
          <span class="stackstrip__item stackstrip__item--accent">生成AI × 化学工学</span>
          <span class="stackstrip__item">Next.js</span>
          <span class="stackstrip__item">TypeScript</span>
          <span class="stackstrip__item">Supabase</span>
          <span class="stackstrip__item">FastAPI</span>
          <span class="stackstrip__item">Neo4j</span>
          <span class="stackstrip__item">Gemini API</span>
          <span class="stackstrip__item">NPU / On-device</span>
        </div>
      </div>

      <section id="works" class="section"></section>
    </main>

    <footer id="contact" class="footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
