<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>長谷川耀俊 / Aki_Ha Portfolio</title>
    <meta
      name="description"
      content="長谷川耀俊 (Aki_Ha) のポートフォリオ。関西大学 化学工学専攻の学生で、Google AI 学生コミュニティのコミュニティアンバサダー。生成AIを使った開発とコミュニティづくりに取り組んでいます。"
    />
    <link rel="canonical" href="https://4kito4.github.io/" />
    <!-- C4.3 — both of these are REWRITTEN by the script below and kept in step
         by src/realtime.ts. They are the only two surfaces where the operating
         system could still decide how this page looks, so neither is left to it:

         • color-scheme was `light dark`, which tells the UA "the page handles
           both, you pick" — and the UA picks from the OS. That governs the
           canvas before the stylesheet applies, the scrollbars and the default
           control palette, so an OS set to dark flashed a dark canvas under the
           cream morning sheet. It is now always a single resolved value.
         • theme-color colours the browser's own bar on mobile. Left unset, that
           bar follows the OS too. The static value here is the light paper base;
           realtime.ts replaces it with the real computed paper once CSS is up.

         The values are the LIGHT defaults; the script corrects them in the same
         breath as data-theme, before anything paints. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4eee1" />
    <meta name="author" content="長谷川耀俊 / Hasegawa Akitoshi" />

    <!-- C4.3 — the sheet follows the reader's choice, then the clock, and never
         the OS (docs/CONCEPT.md §C4). This runs before the stylesheet paints
         anything, so neither a night visit nor a stored choice ever flashes the
         wrong sheet first.

         It duplicates two things from src/realtime.ts — the band boundaries and
         the storage key — because both are needed BEFORE any module can load,
         and there is no way to share them at this point in the document.
         realtime.ts owns the authoritative copy and re-applies all of this
         idempotently. Keep the four boundaries (05/10/16/19) and the key
         'akiha:tod' in step with it. -->
    <script>
      ;(function () {
        var band = null
        try {
          band = localStorage.getItem('akiha:tod')
        } catch (e) {
          /* private mode: the clock decides, which is the default anyway */
        }
        if (['morning', 'day', 'evening', 'night'].indexOf(band) < 0) {
          var h = new Date().getHours()
          band = h >= 19 || h < 5 ? 'night' : h < 10 ? 'morning' : h < 16 ? 'day' : 'evening'
        }
        var theme = band === 'night' ? 'dark' : 'light'
        var root = document.documentElement
        root.dataset.tod = band
        root.dataset.theme = theme
        document.querySelector('meta[name="color-scheme"]').content = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#17130d'
        }
      })()
    </script>

    <!-- Icons. Generated from the mascot art by scripts/make-brand-assets.mjs; the
         cream plate is the page's own paper colour, so the mark keeps a silhouette
         on a dark tab strip instead of dissolving into it. The old favicon.svg was
         unrelated scaffolding art and is no longer referenced. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png" />

    <!-- Social cards. og:image is a 1200x630 sheet set in the site's own display
         faces (outlined, so it renders identically wherever it is built) with the
         mascot on the right — see scripts/make-brand-assets.mjs. Absolute URLs are
         required here: crawlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aki_Ha Portfolio" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://4kito4.github.io/" />
    <meta property="og:title" content="長谷川耀俊 / Aki_Ha Portfolio" />
    <meta
      property="og:description"
      content="化学工学を専攻しながら、生成AIで身の回りの課題を解いています。「つくって、つなげる」が信条。Google AI 学生コミュニティ コミュニティアンバサダー。"
    />
    <meta property="og:image" content="https://4kito4.github.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="長谷川耀俊 / Aki_Ha — 化学工学 × 生成AI。マスコットキャラクターと名前が並んだカード。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="長谷川耀俊 / Aki_Ha Portfolio" />
    <meta
      name="twitter:description"
      content="化学工学を専攻しながら、生成AIで身の回りの課題を解いています。「つくって、つなげる」が信条。Google AI 学生コミュニティ コミュニティアンバサダー。"
    />
    <meta name="twitter:image" content="https://4kito4.github.io/og.jpg" />

    <!-- The two faces the first screen is actually set in: the hero name (Zen Kaku
         900) and the body copy (500). Preloaded because @font-face in a stylesheet
         is only discovered after the CSS parses, and these two gate both the LCP
         element and the first-load curtain, which waits on document.fonts.ready.
         The remaining faces are left to normal discovery — preloading a file the
         first screen does not draw would compete with the ones it does. -->
    <link rel="preload" href="/fonts/zen-kaku-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-kaku-500.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- First-load curtain. Paper-coloured, with the mascot silhouette beating on
         it. Dismissed by REAL readiness (webfonts + the opening's first 24 drop
         frames), capped at 4s, and skipped outright when everything is already
         cached. The bar and the count are the genuine decode tally — there is no
         synthetic progress. Removed instantly under reduced motion. See main.ts. -->
    <div id="preloader" class="preloader" aria-hidden="true">
      <div class="preloader__inner">
        <img
          class="preloader__mark"
          src="/assets/aki_ha_silhouette.png"
          alt=""
          width="110"
          height="110"
          fetchpriority="high"
          decoding="async"
        />
        <div class="preloader__progress">
          <span class="preloader__progress-fill"></span>
        </div>
        <p class="preloader__count">0 / 24</p>
      </div>
    </div>

    <header class="nav">
      <nav class="u-container nav__inner" aria-label="メインナビゲーション">
        <a href="#hero" class="nav__mark"><span data-roll>AKI_HA</span></a>
        <div class="nav__end">
          <div class="nav__links">
            <a href="#about"><span data-roll>自己紹介</span></a>
            <a href="#activity"><span data-roll>活動</span></a>
            <a href="#works"><span data-roll>制作物</span></a>
          </div>
          <!-- The two standing controls, grouped so they sit tight against each
               other rather than at the nav's link spacing — and so the sound
               layer's invitation pill (which anchors to the toggle's parent)
               hangs under the pair. -->
          <div class="nav__controls">
          <!-- C4.3 time-of-day indicator. The clock link used to be stated only
               in the colophon, at the very bottom of a long page, so a reader
               could finish the whole site without ever learning the paper was
               keyed to the hour. This says it from the first paint: the band's
               name plus a sun or a moon for the sheet it implies.

               It is a five-stop CYCLE (朝→昼→夕→夜→観測時刻), not a toggle, so it
               carries no aria-pressed — a two-state attribute cannot describe
               five states. The current value lives in the accessible name
               instead, rewritten on every press by src/realtime.ts, and the
               colophon sentence is a role="status" so the change is announced.

               The VISIBLE state is drawn entirely from the two root attributes
               the head script has already set, in CSS (`.nav__tod-label::before`
               and `.tod-glyph`), so the indicator is correct in the very first
               paint without waiting for a module — and all four band names are
               one CJK character, so the button is the same width in every state
               and nothing can shift. -->
          <button class="nav__tod" type="button" data-tod-cycle aria-label="紙の色">
            <span class="tod-glyph" aria-hidden="true"></span>
            <span class="nav__tod-label" aria-hidden="true"></span>
          </button>
          <!-- C3 sound toggle. VISIBLE FROM THE FIRST PAINT (c3.1): it used to be
               `visibility: hidden` until src/anim/sound.ts added `.is-ready`,
               which meant the one thing announcing that this page has sound only
               existed once a bundle had downloaded, parsed and run. Now CSS shows
               it unconditionally and hides it only under reduced motion, where
               the layer genuinely does nothing. Speaker-plus-slash is the OFF
               state and reads as off at a glance; ON swaps the slash for a small
               three-bar equaliser. Drawn in CSS rather than as an inline SVG path
               because this project ships no icon dependency and none is being
               added. -->
          <button
            class="nav__sound"
            type="button"
            aria-pressed="false"
            aria-label="効果音 オフ"
            data-sound-toggle
          >
            <span class="snd" aria-hidden="true">
              <span class="snd__cone"></span>
              <span class="snd__eq"><span></span><span></span><span></span></span>
              <span class="snd__slash"></span>
            </span>
          </button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Intro stage: the hero lives UNDER the opening from the start. The motion
           layer pins this whole stage and plays the opening sequence as an overlay;
           near the end the overlay's opacity fades to 0 so the white end-frame
           dissolves directly into the cream hero (already mid-entrance) with no
           colour seam or empty beat — the pin then releases on a fully continuous
           visual state. Under reduced motion the opening is display:none and this
           collapses to a plain hero. -->
      <div id="intro" class="intro">
        <section id="hero" class="hero"></section>
        <!-- Decorative only (aria-hidden); hidden entirely under reduced motion. -->
        <section id="opening" class="opening" aria-hidden="true"></section>
      </div>

      <section id="about" class="section"></section>
      <section id="activity" class="section"></section>

      <!-- Stack strip: the single editorial marquee. Static, readable markup;
           P3 animates the track via data-animate="marquee". -->
      <div class="stackstrip" aria-hidden="true">
        <div class="u-container stackstrip__track" data-animate="marquee">
          <span class="stackstrip__item stackstrip__item--accent">生成AI × 化学工学</span>
          <span class="stackstrip__item">Next.js</span>
          <span class="stackstrip__item">TypeScript</span>
          <span class="stackstrip__item">Supabase</span>
          <span class="stackstrip__item">FastAPI</span>
          <span class="stackstrip__item">Neo4j</span>
          <span class="stackstrip__item">Gemini API</span>
          <span class="stackstrip__item">NPU / On-device</span>
        </div>
      </div>

      <section id="works" class="section"></section>
    </main>

    <footer id="contact" class="footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
